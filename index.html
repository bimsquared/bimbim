            <form onsubmit="handleInlineLogin(event)" class="p-8 space-y-5">

                </div>
                <div>
                    <label for="gate-username" class="block text-xs font-semibold text-slate-700 mb-1.5">Username</label>
                    <input type="text" id="gate-username" autocomplete="username" placeholder="Enter username" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:bg-white">
                </div>
                <div>
                    <label for="gate-password" class="block text-xs font-semibold text-slate-700 mb-1.5">Password</label>
                    <input type="password" id="gate-password" autocomplete="current-password" placeholder="Enter password" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:bg-white">
                </div>
